<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${post.title} + ' - 게시판'">글 상세 - 게시판</title>

        <!-- [9주차] 게시글 상세 : GET /board/{id}  (컨트롤러가 넘겨주는 값 : post) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
        <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
        <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
        <link th:href="@{/css/templatemo-first-portfolio-style.css}" rel="stylesheet">
        <link th:href="@{/css/board.css}" rel="stylesheet">
    </head>

    <body>
        <header class="board-header">
            <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <a th:href="@{/board}" class="small"><i class="bi-arrow-left me-1"></i>목록으로</a>
                    <h1 class="mt-1"><i class="bi-chat-square-text me-2"></i>게시판</h1>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <th:block sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" class="btn btn-light btn-sm-custom"><i class="bi-box-arrow-in-right me-1"></i>로그인</a>
                    </th:block>
                    <th:block sec:authorize="isAuthenticated()">
                        <span><i class="bi-person-circle me-1"></i><strong sec:authentication="name">student1</strong>님</span>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-light btn-sm-custom"><i class="bi-box-arrow-right me-1"></i>로그아웃</button>
                        </form>
                    </th:block>
                </div>
            </div>
        </header>

        <main class="board-body">
            <div class="container">
                <div class="board-card">
                    <h3 class="mb-2" th:text="${post.title}">글 제목</h3>
                    <div class="post-meta mb-3">
                        <span><i class="bi-person me-1"></i><span th:text="${post.author.name}">홍길동</span></span>
                        <span><i class="bi-clock me-1"></i>작성 <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-11-04 10:00</span></span>
                        <!-- 수정한 적이 있을 때만 "수정 시간" 표시 -->
                        <span th:if="${post.updatedAt}"><i class="bi-pencil me-1"></i>수정 <span th:text="${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}">2026-11-04 11:00</span></span>
                        <span><i class="bi-eye me-1"></i>조회 <span th:text="${post.viewCount}">0</span></span>
                    </div>
                    <hr>
                    <div class="post-content" th:text="${post.content}">글 내용</div>
                    <hr>

                    <div class="d-flex flex-wrap gap-2">
                        <a th:href="@{/board}" class="btn btn-outline-secondary btn-sm-custom"><i class="bi-list-ul me-1"></i>목록</a>
                        <th:block sec:authorize="isAuthenticated()">
                            <!-- 글쓴이 본인 : 수정 · 삭제 (화면에서 숨기는 것은 1차, 서버의 본인 확인이 2차) -->
                            <th:block th:if="${post.author.username == #authentication.name}">
                                <a th:href="@{/board/{id}/edit(id=${post.id})}" class="custom-btn btn btn-sm-custom"><i class="bi-pencil-square me-1"></i>수정</a>
                                <form th:action="@{/board/{id}/delete(id=${post.id})}" method="post" class="m-0"
                                      onsubmit="return confirm('정말 삭제하시겠습니까?');">
                                    <button type="submit" class="btn btn-outline-danger btn-sm-custom"><i class="bi-trash me-1"></i>삭제</button>
                                </form>
                            </th:block>
                            <!-- 관리자 : 남의 글은 삭제만 가능 (수정은 본인만) -->
                            <form sec:authorize="hasRole('ADMIN')" th:if="${post.author.username != #authentication.name}"
                                  th:action="@{/board/{id}/delete(id=${post.id})}" method="post" class="m-0"
                                  onsubmit="return confirm('관리자 권한으로 삭제하시겠습니까?');">
                                <button type="submit" class="btn btn-danger btn-sm-custom"><i class="bi-shield-x me-1"></i>관리자 삭제</button>
                            </form>
                        </th:block>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
