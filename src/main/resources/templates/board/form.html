<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${postId != null ? '글 수정' : '글쓰기'} + ' - 게시판'">글쓰기 - 게시판</title>

        <!-- [9주차] 글쓰기 · 수정 공용 화면 : GET /board/write, GET /board/{id}/edit -->
        <!-- 컨트롤러가 넘겨주는 값 : postForm (입력값), postId (수정일 때만), error -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
        <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
        <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
        <link th:href="@{/css/templatemo-first-portfolio-style.css}" rel="stylesheet">
        <link th:href="@{/css/board.css}" rel="stylesheet">
    </head>

    <body>
        <header class="board-header">
            <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <a th:href="@{/board}" class="small"><i class="bi-arrow-left me-1"></i>목록으로</a>
                    <h1 class="mt-1"><i class="bi-pencil-square me-2"></i><span th:text="${postId != null ? '글 수정' : '글쓰기'}">글쓰기</span></h1>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <th:block sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" class="btn btn-light btn-sm-custom"><i class="bi-box-arrow-in-right me-1"></i>로그인</a>
                    </th:block>
                    <th:block sec:authorize="isAuthenticated()">
                        <span><i class="bi-person-circle me-1"></i><strong sec:authentication="name">student1</strong>님</span>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-light btn-sm-custom"><i class="bi-box-arrow-right me-1"></i>로그아웃</button>
                        </form>
                    </th:block>
                </div>
            </div>
        </header>

        <main class="board-body">
            <div class="container">
                <div th:if="${error}" class="alert alert-danger py-2" role="alert">
                    <i class="bi-exclamation-circle me-1"></i> <span th:text="${error}">에러 메시지</span>
                </div>

                <div class="board-card">
                    <!-- postId 가 있으면 수정(POST /board/{id}/edit), 없으면 글쓰기(POST /board/write) -->
                    <!-- th:action 을 써야 CSRF 토큰이 자동으로 들어간다 (action 만 쓰면 403) -->
                    <form th:action="${postId != null} ? @{/board/{id}/edit(id=${postId})} : @{/board/write}" method="post">
                        <div class="mb-3">
                            <label for="title" class="form-label">제목</label>
                            <input type="text" id="title" name="title" class="form-control" maxlength="100"
                                   th:value="${postForm?.title}" placeholder="제목을 입력하세요">
                        </div>
                        <div class="mb-4">
                            <label for="content" class="form-label">내용</label>
                            <textarea id="content" name="content" class="form-control" rows="12"
                                      th:text="${postForm?.content}" placeholder="내용을 입력하세요"></textarea>
                        </div>
                        <!-- 작성자 입력칸은 없다 → 로그인한 사람으로 서버가 정한다 -->
                        <div class="d-flex gap-2">
                            <a th:href="${postId != null} ? @{/board/{id}(id=${postId})} : @{/board}" class="btn btn-outline-secondary btn-sm-custom">취소</a>
                            <button type="submit" class="custom-btn btn btn-sm-custom">
                                <i class="bi-check-lg me-1"></i><span th:text="${postId != null ? '저장' : '등록'}">등록</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </body>
</html>
